<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Química UPDS</title>

    <!-- Más adelante conectaremos aquí nuestro archivo CSS -->
</head>

<body>

    <!-- ENCABEZADO -->
    <header>
        <h1>Química <span>UPDS</span></h1>
        <p>Facultad de Ingeniería y Ciencias Exactas</p>
    </header>


    <!-- CONTENIDO PRINCIPAL -->
    <main>

        <!-- BUSCADOR -->
        <section>
            <h2>🔍 Buscar</h2>

            <input
                type="text"
                placeholder="Buscar elemento, compuesto, reacción..."
            >
        </section>


        <!-- DATO DEL DÍA -->
        <section>
            <h2>💡 DATO DEL DÍA</h2>

            <h3>Gasolina (Isooctano - C₈H₁₈)</h3>

            <p>
                Mezcla de hidrocarburos no polares
                utilizada como combustible.
            </p>

            <button>Ver ficha en el catálogo →</button>
        </section>


        <!-- DESAFÍO -->
        <section>
            <h2>⚡ DESAFÍO RÁPIDO DEL DÍA</h2>

            <p>
                ¿El ion NO⁺ es diamagnético o paramagnético?
            </p>

            <button>Diamagnético (10 e⁻)</button>
            <button>Paramagnético</button>
        </section>


        <!-- ACCESOS DIRECTOS -->
        <section>
            <h2>▦ ACCESOS DIRECTOS</h2>

            <button>⚛️ Calculadora TOM</button>

            <button>▦ Tabla Periódica</button>

            <button>🧪 Reacciones</button>

            <button>🛢️ Catálogo Cotidiano</button>
        </section>

    </main>


    <!-- NAVEGACIÓN INFERIOR -->
    <nav>
        <button>🏠<br>Inicio</button>
        <button>📊<br>Elem</button>
        <button>⚛️<br>Enlaces</button>
        <button>🧪<br>Reacc</button>
        <button>🛢️<br>Cat</button>
        <button>📝<br>Eval</button>
    </nav>


    <!-- CRÉDITO -->
    <footer>
        Developed by J. Poma · 2026
    </footer>

</body>
</html>
